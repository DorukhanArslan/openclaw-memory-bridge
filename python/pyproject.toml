[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openclaw-memory-bridge"
version = "0.1.0"
description = "Python client for the local OpenClaw TypeScript memory bridge"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[project.optional-dependencies]
chat = ["certifi>=2025.1.31", "truststore>=0.10.0,<1"]

[tool.setuptools.packages.find]
where = ["src"]
